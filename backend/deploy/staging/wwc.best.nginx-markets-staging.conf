# WWC Markets read-only API — STAGING alias (wwc.best or staging.wwc.best)
# Proxies to sysarchn8n staging upstream only. Does NOT touch /api/lead or /api/v1/leads.
# Apply via: python n8n/current/patch_site_nginx_markets_staging_2026-08-09.py --dry-run

    location = /api/site-context {
        limit_except GET { deny all; }
        proxy_pass https://sysarchn8n.duckdns.org/whieda-platform-staging/api/site-context;
        proxy_ssl_server_name on;
        proxy_set_header Host sysarchn8n.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host wwc.best;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /api/catalog-prices {
        limit_except GET { deny all; }
