# WHIEDA Owner Cabinet — staging single host (P0.3.1)
# Apply on site VPS (173.249.45.83) via patch_site_nginx_admin_staging_2026-08-09.py
# DNS: admin-staging.wwc.best → site VPS (единственная A-запись)
# TLS: certbot -d admin-staging.wwc.best (не wwc.best, если не wildcard)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin-staging.wwc.best;

    ssl_certificate /etc/letsencrypt/live/admin-staging.wwc.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-staging.wwc.best/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/admin-staging-wwc-best;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Staging Platform API — same-origin /api/v1/* → Core through localhost reverse tunnel.
    # Content-access is exercised on the cabinet staging host, but belongs to
    # the public WWC tenant.  Preserve the browser origin while explicitly
    # selecting that tenant for this one staging-only route.
    location ^~ /api/v1/content-access {
        proxy_pass http://127.0.0.1:18081/v1/content-access;
        proxy_http_version 1.1;
        proxy_set_header Host admin-staging.wwc.best;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host wwc.best;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host admin-staging.wwc.best;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host admin-staging.wwc.best;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Static lead detail shell for arbitrary UUID (Astro prerender placeholder)
    location ~ ^/cabinet/leads/[0-9a-fA-F-]+/?$ {
        try_files /cabinet/leads/_/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin-staging.wwc.best;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://admin-staging.wwc.best$request_uri;
    }
}
