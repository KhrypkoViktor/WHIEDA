# Platform Core API routes — proxy from wwc.best site nginx via sysarchn8n HTTPS.
# Port 8080 is not reachable between VPS; Core is exposed at /whieda-platform/ on sysarchn8n.
# Apply after: python n8n/current/patch_ai_nginx_platform_core_2026-08-02.py

    location ~ ^/api/v1/public/ref/([^/]+)/?$ {
        limit_except GET { deny all; }
        proxy_pass https://sysarchn8n.duckdns.org/whieda-platform/api/v1/public/ref/$1;
        proxy_ssl_server_name on;
        proxy_set_header Host sysarchn8n.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host wwc.best;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "public, max-age=60";
    }

    location = /api/v1/leads {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass https://sysarchn8n.duckdns.org/whieda-platform/api/v1/leads;
        proxy_ssl_server_name on;
        proxy_set_header Host sysarchn8n.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host wwc.best;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Temporary alias of the same Core lead handler. Apply in a separate
    # site nginx patch, never in the same cutover as cart or advisor.
    location = /api/lead {
