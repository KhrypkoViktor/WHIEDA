# Академия v2 (02.10.2026): раздача видео/файлов/картинок курсов и загрузка кусками.
# Готовит Core-сессия, ПРИМЕНЯЕТ ЛИД (инфраструктура, AGENTS.md → «Правило выпуска»).
# Не копировать вслепую: два разных nginx, у каждого свой блок ниже.
#
# Как устроено
#   Файлы лежат на сервере Core: /opt/whieda-platform-core/media/academy/<tenant>/academy/<media_id>/…
#   (PLATFORM_ACADEMY_MEDIA_DIR; один каталог для staging и боя — база общая).
#   Core выдаёт ссылку /academy-media/<ключ>?u=<telegram_user_id>&e=<unix-срок>&s=<подпись>,
#   подпись = base64url(md5("<e>/academy-media/<ключ><u> <секрет>")) — стандартный модуль secure_link.
#   Срок 1 час, ссылка привязана к Telegram id ученика. Секрет — PLATFORM_MEDIA_SIGNING_SECRET
#   (тот же в .env Core staging и боя и в блоке A). Это защита уровня базовых тарифов
#   видеохостингов, не DRM.
#   Пока блоки не применены: PLATFORM_ACADEMY_MEDIA_VIA_API=true в .env Core — ссылки ведут
#   в Core (/api/v1/content-access/academy/media/files/…), он отдаёт файл сам, с Range.
#
# Порядок применения
#   1. Сервер Core: install -d -m 0755 /opt/whieda-platform-core/media/academy
#      (api и worker пишут туда от root; nginx читает).
#   2. docker-compose Core (боевой и staging): каталог смонтирован в api и worker боя и в api staging —
#      см. backend/deploy/core/docker-compose.yml и backend/deploy/staging/docker-compose.yml
#      в ветке core/academy-v2-lms (сервер берёт compose из своего src/deploy, не из релиза).
#   3. Секрет: openssl rand -hex 32 → PLATFORM_MEDIA_SIGNING_SECRET в оба .env Core.
#   4. Блок A — в шлюз docker-nginx-1 через /opt/whieda-core/safe_install_dify_nginx_conf.sh
#      (CORE_NGINX_TELEGRAM_SAFETY_RUNBOOK.md), каталог медиа смонтировать в контейнер nginx
#      только на чтение.
#   5. Блок B — в nginx сайта (vhost wwc.best и staging.wwc.best), nginx -t, reload.
#   6. Проверка: подписанная ссылка из GET /api/v1/content-access/academy/media/<id>/url
#      открывается (200, Range → 206); с изменённым u или s — 403; после срока — 410.
#      Потом PLATFORM_ACADEMY_MEDIA_VIA_API=false (или убрать) и перезапуск api.


# ---------------------------------------------------------------------------------------------
# A. Шлюз Core (sysarchn8n.duckdns.org, контейнер docker-nginx-1) — внутри server { } этого хоста.
#    В docker-compose dify у сервиса nginx добавить том:
#      - /opt/whieda-platform-core/media/academy:/var/academy-media:ro
# ---------------------------------------------------------------------------------------------

    location ^~ /academy-media/ {
        limit_except GET HEAD { deny all; }
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri$arg_u __PLATFORM_MEDIA_SIGNING_SECRET__";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        alias /var/academy-media/;
        autoindex off;
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Куски загрузки идут в Core через этот же шлюз: кусок 5 МБ (+ запас). Если у блока
    # /whieda-platform/ client_max_body_size меньше 6m — добавить отдельный, более длинный префикс
    # с тем же proxy_pass, что у /whieda-platform/ (адрес Core в шлюзе не меняется):
    #
    # location ^~ /whieda-platform/api/v1/content-access/academy/ {
    #     client_max_body_size 6m;
    #     proxy_request_buffering off;
    #     proxy_buffering off;
    #     proxy_read_timeout 120s;
    #     proxy_pass <как у /whieda-platform/>/api/v1/content-access/academy/;
    #     <те же proxy_set_header, что у /whieda-platform/>
    # }
    # Для staging — то же с /whieda-platform-staging/ (порт 8081).


# ---------------------------------------------------------------------------------------------
# B. nginx сайта (vhost wwc.best; для staging.wwc.best — то же, но Core staging:
#    /whieda-platform-staging/…). Ставить ВЫШЕ общего «location ^~ /api/v1/content-access»:
#    более длинный префикс ^~ выигрывает, у общего блока client_max_body_size 16k.
# ---------------------------------------------------------------------------------------------

    # Медиа Академии с того же адреса, что и сайт: <video src>, <img>, скачивание файла (download).
    location ^~ /academy-media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://sysarchn8n.duckdns.org/academy-media/;
        proxy_ssl_server_name on;
        proxy_set_header Host sysarchn8n.duckdns.org;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # API Академии: загрузка видео кусками по 5 МБ; ответы видео через Core (fallback) — потоком.
    location ^~ /api/v1/content-access/academy/ {
        client_max_body_size 6m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass https://sysarchn8n.duckdns.org/whieda-platform/api/v1/content-access/academy/;
        proxy_ssl_server_name on;
        proxy_set_header Host sysarchn8n.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host wwc.best;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
